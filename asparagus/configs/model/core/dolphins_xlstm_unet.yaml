_pretrain_net:
  _target_: asparagus.modules.networks.dolphins_xlstm_unet.${model.pretrain_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  use_skip_connections: ${model.use_skip_connections}
  xlstm_stages: ${model.xlstm_stages}

_seg_net:
  _target_: asparagus.modules.networks.dolphins_xlstm_unet.${model.seg_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  deep_supervision: ${model.deep_supervision}
  use_skip_connections: ${model.use_skip_connections}
  xlstm_stages: ${model.xlstm_stages}

_cls_net:
  _target_: asparagus.modules.networks.dolphins_xlstm_unet.${model.cls_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  xlstm_stages: ${model.xlstm_stages}
  dropout_op_kwargs:
    encoder_dropout_rate: ${model.encoder_dropout_rate}
    decoder_dropout_rate: ${model.decoder_dropout_rate}
    inplace: true

_plugin_seg_net:

pretrain_optim: AdamW
pretrain_lr: 1e-4

train_optim: SGD
train_lr: 1e-2

finetune_optim: AdamW
finetune_lr: 1e-3

weight_decay: 3e-5
nesterov: True
momentum: 0.99
patch_embed_size: 4

min_test_patch_size: [96, 96, 96]
deep_supervision: False
use_skip_connections: True
starting_filters: 40
xlstm_stages: [3, 4]
