_pretrain_net:
  _target_: asparagus.modules.networks.brainaxl.${model.pretrain_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  use_skip_connections: ${model.use_skip_connections}
  xlstm_stages: ${model.xlstm_stages}

_seg_net:
  _target_: asparagus.modules.networks.brainaxl.${model.seg_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  deep_supervision: ${model.deep_supervision}
  use_skip_connections: ${model.use_skip_connections}
  xlstm_stages: ${model.xlstm_stages}

_cls_net:
  _target_: asparagus.modules.networks.brainaxl.${model.cls_net}
  dimensions: ${model.dimensions}
  starting_filters: ${model.starting_filters}
  xlstm_stages: ${model.xlstm_stages}
  semantic_dim: ${model.semantic_dim}
  dropout_op_kwargs:
    encoder_dropout_rate: ${model.encoder_dropout_rate}
    decoder_dropout_rate: ${model.decoder_dropout_rate}
    inplace: true
  late_fusion: ${model.late_fusion}
  gated_late_fusion: ${model.gated_late_fusion}
  l2_normalize: ${model.l2_normalize}

_plugin_seg_net:

pretrain_optim: AdamW
pretrain_lr: 1e-4
train_optim: SGD
train_lr: 1e-2
finetune_optim: AdamW
finetune_lr: 1e-3
weight_decay: 3e-5
nesterov: true
momentum: 0.99
patch_embed_size: 4
min_test_patch_size: [96, 96, 96]
deep_supervision: false
use_skip_connections: true
starting_filters: 40
xlstm_stages: [3, 4]
semantic_dim: 512
encoder_dropout_rate: 0.0
decoder_dropout_rate: 0.0
late_fusion: false
gated_late_fusion: true
l2_normalize: true
