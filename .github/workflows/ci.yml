name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: Release integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify provenance, syntax, and repository hygiene
        run: python scripts/verify_release.py

      - name: Lint canonical public code
        run: |
          python -m pip install ruff==0.14.8
          ruff check scripts/verify_release.py \
            asparagus/asparagus/modules/networks/brainaxl.py \
            asparagus/tests/test_brainaxl.py
          ruff format --check scripts/verify_release.py \
            asparagus/asparagus/modules/networks/brainaxl.py \
            asparagus/tests/test_brainaxl.py

  model-tests:
    name: BrainAxL model tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: asparagus/pyproject.toml

      - name: Install minimal CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.6.0 torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==9.0.1
          python -m pip install --no-deps \
            'gardening_tools @ git+https://github.com/Sllambias/gardening_tools.git@6b15c7ee48c5349a21610202daa2acd870b85246'

      - name: Run architecture and checkpoint-compatibility tests
        env:
          PYTHONPATH: asparagus
        run: python -m pytest asparagus/tests/test_brainaxl.py
