name: Bug report
description: Report a reproducible problem in BrainAxL code or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach patient data, restricted challenge data, credentials, or
        model checkpoints.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe command or code sample that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: BrainAxL revision
      description: Commit SHA or release tag.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, CUDA, GPU, and installation method.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed patient-identifying and restricted data from this report.
          required: true
